; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; ESP-NN full-pipeline integration (full_esp32_integration.md):
; CONFIG_NN_OPTIMIZED + CONFIG_IDF_TARGET_ESP32S3 select model_weights.h's
; esp32s3-accelerated conv2d_int8() over the portable reference.
;
; NOTE: an earlier version of this comment described a "16-alignment
; assembly bug" -- that the esp32s3 kernel corrupts output when
; kh*in_channels isn't a multiple of 16, worked around by routing
; non-aligned layers (lum_conv) through a naive fallback and zero-padding
; others (post_concat_conv 39->48). THAT DIAGNOSIS WAS WRONG and the
; workarounds it describes no longer exist in the generated code.
;
; The real constraint is that esp_nn's conv scratch POINTER must be
; 16-byte aligned: heap_caps_malloc guarantees only 8 bytes, so
; model_esp_nn_init() uses heap_caps_aligned_alloc(16, ...). With a
; misaligned pointer the kernel silently corrupts output (mod16==0
; bit-exact, mod16==8 most elements wrong), which is what was originally
; misattributed to per-layer channel counts. Once that was fixed, every
; layer ran correctly through esp_nn with no per-layer special-casing --
; including lum_conv at in_channels=1 (kh*in_ch = 3), which the old theory
; called unsafe, and which the shipping build times at 3.66 ms ACCELERATED
; (7.39 ms was the old fallback). Both the runtime fallback and the
; channel zero-padding were removed after that hardware confirmation.
;
; export_cnn_c_weights.py is authoritative here and says so in three
; places (format_flat_conv_weight's docstring, the generated
; model_esp_nn_init() comment, and the conv_layer_shapes comment). Trust
; it over any firmware comment. Do NOT reintroduce channel padding or a
; per-layer fallback to work around "alignment" -- padding costs real
; compute for nothing.
;
; -Ilib/esp_nn/src/common: PlatformIO's LDF compiles lib/esp_nn/'s own
; .c/.S files regardless of the flags above (it scans for #include text,
; doesn't evaluate model_weights.h's #if), and those files'
; unconditional `#include <common_functions.h>` needs this path.
build_flags =
    ; USB SERIAL. The Freenove board definition sets ARDUINO_USB_CDC_ON_BOOT=0,
    ; so Serial goes to UART0 and reading /dev/ttyACM0 returns nothing -- which
    ; means a panic's backtrace, the one piece of evidence that identifies the
    ; crash, is thrown away. That is how the cam_task stack-canary panic went
    ; undiagnosed for days (see markdown/stream_stall_issue.md); it was only
    ; found after adding these flags to esp32_fps. This firmware is the one
    ; that was running when those resets were observed, so it needs them too.
    ;
    ; Decode a backtrace with:
    ;   xtensa-esp32s3-elf-addr2line -pfiaC -e .pio/build/freenove_esp32_s3_wroom/firmware.elf <addrs>
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_NN_OPTIMIZED=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -Ilib/esp_nn/src/common
