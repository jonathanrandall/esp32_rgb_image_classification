; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Library options: dependencies, extra library storages
;
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---------------------------------------------------------------------------
; ESP-NN: ENABLED.
; ---------------------------------------------------------------------------
;
; include/model_weights.h carries both paths behind
; #if defined(CONFIG_NN_OPTIMIZED) && defined(CONFIG_IDF_TARGET_ESP32S3):
; the two flags below select esp_nn_conv_s8 with OHWI weights, and without
; them the identical model_forward() runs portable C with OIHW weights. Only
; the conv kernel and the weight layout differ between them, which is what
; makes portable-vs-accelerated on this board a clean same-weights,
; same-code-path comparison.
;
; TO GO BACK TO THE PORTABLE BUILD (a real measurement, not a fallback -- the
; DCT firmware's comparable portable number is 306 ms inference / 2.3 fps):
;
;   1. comment out the two -D lines below
;   2. add:  lib_ignore = esp_nn
;
; Step 2 is not optional and not belt-and-braces. PlatformIO's LDF decides
; what to compile from a text scan for #include and does not evaluate
; preprocessor conditionals, so dropping the -D flags alone still drags
; lib/esp_nn/'s .c/.S into the build. lib_ignore is what makes "no ESP-NN in
; this binary" structurally true rather than merely intended. Verify either
; way with: xtensa-esp32s3-elf-nm firmware.elf | grep -c esp_nn
;
; ONE THING TO GET RIGHT IN THAT FUTURE HEADER, and one myth to ignore.
;
; The real constraint is that ESP-NN's conv SCRATCH BUFFER POINTER must be
; 16-byte aligned. heap_caps_malloc guarantees only 8, which is not enough:
; with a misaligned scratch pointer the esp32s3 assembly kernel silently
; corrupts its output (mod16==0 gives bit-exact results, mod16==8 gets most
; elements wrong). heap_caps_aligned_alloc(16, ..., MALLOC_CAP_SPIRAM) is
; required. The exporter's generated model_esp_nn_init() already does this, so
; using the header's own init gets it for free -- just never hand-roll a
; scratch allocation with heap_caps_malloc.
;
; THE MYTH: that the kernel requires kh*in_channels to be a multiple of 16,
; which would make conv0 (kh=3, in_ch=3, product 9) unsafe and force either
; zero-padding the input channels to 16 or a naive fallback. That diagnosis
; was investigated and DISPROVEN on real hardware in the DCT project --
; verified here against python_code/export_cnn_c_weights.py, which says so in
; three places (lines ~84, ~158, ~361) and notes both workarounds were removed
; once the real cause was confirmed. The decisive evidence: the DCT model's
; own lum_conv has in_channels=1 (product 3, far more "non-conforming" than
; conv0's 9) and runs through ESP-NN accelerated in the shipping build.
;
; So conv0 needs no special-casing: no zero-padding, no fallback, all four
; convs go straight through ESP-NN. This matters beyond tidiness -- padding
; conv0's channels 3 -> 16 would have multiplied its work by ~5.3x (~8.3M ->
; ~44M MACs), and conv0's cost is precisely what this firmware exists to
; measure, so acting on the myth could have falsely confirmed the hypothesis
; under test.
;
; NOTE: the stale version of this claim is still present in
; esp32_cam/esp32_classifier/platformio.ini, which is where this file's
; comments were inherited from. If you meet it again there, it is the old
; error resurfacing, not new evidence.
;
; -Ilib/esp_nn/src/common is kept unconditionally: it costs nothing when the
; library is ignored, and lib/esp_nn's sources have an unconditional
; #include <common_functions.h> that needs this path whenever it is built.
build_flags =
    -DCONFIG_NN_OPTIMIZED=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -Ilib/esp_nn/src/common
